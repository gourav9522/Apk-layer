    <script>
        const FIREBASE_DB_URL = "https://apk-layer-default-rtdb.firebaseio.com/apps";
        let allApps = [];
        let isAdminUnlocked = false;
        let bannerClicks = 0;
        let clickTimer = null;

        document.getElementById('bannerImg').addEventListener('click', () => {
            bannerClicks++;
            clearTimeout(clickTimer);
            if (bannerClicks >= 5) {
                bannerClicks = 0;
                promptAdminPassword();
            } else {
                clickTimer = setTimeout(() => { bannerClicks = 0; }, 1000);
            }
        });

        function promptAdminPassword() {
            const pass = prompt("Enter Admin Password to manage/delete apps:");
            if (pass === "9522") {
                isAdminUnlocked = true;
                document.getElementById('adminBadge').classList.remove('hidden');
                alert("🔓 Admin mode unlocked! You can now delete apps.");
                displayApps(allApps);
            } else if (pass !== null) {
                alert("❌ Wrong password!");
            }
        }

        async function initStore() {
            const loadingText = document.getElementById('loadingText');
            try {
                const res = await fetch(`${FIREBASE_DB_URL}.json`);
                if (!res.ok) {
                    throw new Error(`Server status: ${res.status} (Check Firebase Rules)`);
                }
                const data = await res.json();
                if (data) {
                    allApps = Object.entries(data).map(([key, val]) => ({ ...val, fbKey: key })).reverse();
                    if (loadingText) loadingText.style.display = 'none';
                } else {
                    if (loadingText) loadingText.innerText = "Database is empty! No apps uploaded yet.";
                }
            } catch(e) {
                console.error("Error fetching global apps", e);
                if (loadingText) loadingText.innerHTML = `<span class="text-red-400">❌ Error: ${e.message}</span>`;
            }

            displayApps(allApps);
            checkRoute();
        }

        function displayApps(apps) {
            const grid = document.getElementById('app-grid');
            if(apps.length === 0) {
                return;
            }
            grid.innerHTML = apps.map(app => `
                <div class="flex items-center justify-between p-4 bg-slate-900 hover:bg-slate-900/80 rounded-2xl border emerald-border transition shadow-md">
                    <div onclick="openApp('${app.id}')" class="flex items-center gap-4 flex-1 cursor-pointer">
                        <img src="${app.logoUrl}" alt="${app.appName}" class="w-14 h-14 rounded-2xl object-cover bg-slate-950 border emerald-border">
                        <div>
                            <h2 class="text-base font-bold text-slate-100">${app.appName}</h2>
                            <p class="text-xs text-amber-300/80 mt-0.5">Ver: ${app.version || '1.0'} • ${app.size || 'APK'}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="shareApp('${app.id}', '${app.appName}', event)" class="px-3 py-2 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white rounded-xl text-xs font-bold border border-emerald-500/30 transition">
                            Share
                        </button>
                        ${isAdminUnlocked ? `
                            <button onclick="deleteApp('${app.fbKey \vert{}\vert{} app.id}', '${app.appName}')" class="px-3 py-2 bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white rounded-xl text-xs font-bold border border-red-500/30 transition">
                                Delete
                            </button>
                        ` : ''}
                        <span onclick="openApp('${app.id}')" class="px-4 py-2 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white rounded-xl text-xs font-bold border border-emerald-500/30 cursor-pointer transition">View</span>
                    </div>
                </div>
            `).join('');
        }

        function shareApp(appId, appName, event) {
            if(event) event.stopPropagation();
            let webUrl = "https://apklayer.sbs/#app=" + appId;
            let shareText = `Download ${appName} on ApkLayer!`;

            if (navigator.share) {
                navigator.share({
                    title: appName,
                    text: shareText,
                    url: webUrl
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(webUrl);
                alert(`Link copied for ${appName}:\n${webUrl}`);
            }
        }

        async function deleteApp(fbKey, appName) {
            const pass = prompt(`Confirm deletion for "${appName}"?\nEnter password (9522):`);
            if (pass !== "9522") {
                if (pass !== null) alert("❌ Incorrect password! Deletion cancelled.");
                return;
            }

            try {
                const res = await fetch(`${FIREBASE_DB_URL}/${fbKey}.json`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    alert(`✅ "${appName}" deleted successfully from server!`);
                    allApps = allApps.filter(a => (a.fbKey || a.id) !== fbKey);
                    displayApps(allApps);
                } else {
                    alert("❌ Failed to delete from server.");
                }
            } catch (err) {
                alert("❌ Error: " + err.message);
            }
        }

        function filterApps() {
            let query = document.getElementById('search').value.toLowerCase();
            let filtered = allApps.filter(app => app.appName.toLowerCase().includes(query));
            displayApps(filtered);
        }

        function openApp(appId) {
            window.location.hash = `app=${appId}`;
            renderDetail(appId);
        }

        function updateMetaTags(app) {
            if (!app) return;
            document.getElementById('pageTitle').innerText = `${app.appName} v${app.version || '1.0'} - Download APK | ApkLayer`;
            
            document.getElementById('metaTitle').setAttribute('content', `${app.appName} - Download on ApkLayer`);
            document.getElementById('metaDesc').setAttribute('content', app.description || `Download ${app.appName} safely from ApkLayer.`);
            document.getElementById('metaImage').setAttribute('content', app.logoUrl);

            document.getElementById('twitterTitle').setAttribute('content', `${app.appName} - Download on ApkLayer`);
            document.getElementById('twitterDesc').setAttribute('content', app.description || `Download ${app.appName} safely from ApkLayer.`);
            document.getElementById('twitterImage').setAttribute('content', app.logoUrl);
        }

        function renderDetail(appId) {
            let app = allApps.find(a => a.id == appId);
            if (!app) {
                resetMetaTags();
                document.getElementById('home-view').classList.remove('hidden');
                document.getElementById('detail-view').classList.add('hidden');
                displayApps(allApps);
                return;
            }

            updateMetaTags(app);

            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');

            document.getElementById('shareDetailBtn').onclick = () => shareApp(app.id, app.appName);

            let screenshotsHtml = '';
            if (app.screenshots && Array.isArray(app.screenshots) && app.screenshots.length > 0) {
                screenshotsHtml = `
                    <div class="mb-6 w-full text-left">
                        <h4 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-3">App Screenshots</h4>
                        <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-none">
                            ${app.screenshots.map(sUrl => `<img src="${sUrl}" class="w-36 h-64 object-cover rounded-2xl border emerald-border bg-slate-950 flex-shrink-0 shadow-md">`).join('')}
                        </div>
                    </div>
                `;
            }

            document.getElementById('app-detail-content').innerHTML = `
                <div class="flex flex-col items-center text-center">
                    <img src="${app.logoUrl}" class="w-24 h-24 rounded-3xl object-cover bg-slate-950 border emerald-border mb-4 shadow-xl">
                    <h2 class="text-2xl font-bold text-white mb-1">${app.appName}</h2>
                    <p class="text-xs text-emerald-400 font-mono mb-2">${app.packageName || ''}</p>
                    <p class="text-xs text-slate-300 mb-6 max-w-sm leading-relaxed">${app.description || ''}</p>
                    
                    <div class="grid grid-cols-2 gap-4 w-full bg-slate-950 p-4 rounded-2xl border emerald-border mb-6 text-left text-xs shadow-inner">
                        <div><span class="text-slate-500 block mb-0.5">Version</span> <strong class="text-amber-300">${app.version || '1.0'}</strong></div>
                        <div><span class="text-slate-500 block mb-0.5">File Size</span> <strong class="text-amber-300">${app.size || 'N/A'}</strong></div>
                    </div>

                    ${screenshotsHtml}

                    <button id="downloadBtn" onclick="startDownload('${app.archiveUrl}')" class="w-full py-4 bg-gradient-to-r from-emerald-600 to-amber-600 hover:from-emerald-500 hover:to-amber-500 rounded-2xl font-extrabold text-sm transition shadow-lg shadow-emerald-900/30 text-white cursor-pointer">
                        Download APK
                    </button>
                </div>
            `;

            let relatedApps = allApps.filter(a => a.id != appId);
            const relatedGrid = document.getElementById('related-apps-grid');
            
            if (relatedApps.length === 0) {
                relatedGrid.innerHTML = '<p class="text-xs text-slate-500">No other apps available.</p>';
            } else {
                relatedGrid.innerHTML = relatedApps.slice(0, 4).map(rel => `
                    <div onclick="openApp('${rel.id}')" class="flex items-center justify-between p-3.5 bg-slate-900 hover:bg-slate-900/80 rounded-2xl border emerald-border cursor-pointer transition shadow-md">
                        <div class="flex items-center gap-3">
                            <img src="${rel.logoUrl}" class="w-11 h-11 rounded-xl object-cover bg-slate-950 border emerald-border">
                            <div>
                                <h4 class="text-sm font-bold text-slate-200">${rel.appName}</h4>
                                <p class="text-[11px] text-amber-300/80">Ver: ${rel.version || '1.0'}</p>
                            </div>
                        </div>
                        <span class="text-xs text-emerald-400 font-bold px-3 py-1.5 bg-emerald-600/10 border border-emerald-500/20 rounded-xl">View</span>
                    </div>
                `).join('');
            }
        }

        function startDownload(url) {
            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            let count = 5;
            btn.innerText = `Preparing download in ${count}s...`;
            let t = setInterval(() => {
                count--;
                if(count > 0) {
                    btn.innerText = `Preparing download in ${count}s...`;
                } else {
                    clearInterval(t);
                    btn.innerText = `Download Starting...`;
                    window.location.href = url;
                    setTimeout(() => { btn.disabled = false; btn.innerText = `Download APK`; }, 3000);
                }
            }, 1000);
        }

        function goBack() {
            window.location.hash = '';
            resetMetaTags();
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
            displayApps(allApps);
        }

        function resetMetaTags() {
            document.getElementById('pageTitle').innerText = "ApkLayer - Free Android App Store";
            document.getElementById('metaTitle').setAttribute('content', "ApkLayer - Free Android App Store");
            document.getElementById('metaDesc').setAttribute('content', "Download trusted Android apps and games safely on ApkLayer.");
            document.getElementById('metaImage').setAttribute('content', "https://archive.org/download/image_2a884fe73/image_2a884fe7~3.jpg");
            document.getElementById('twitterTitle').setAttribute('content', "ApkLayer - Free Android App Store");
            document.getElementById('twitterDesc').setAttribute('content', "Download trusted Android apps and games safely on ApkLayer.");
            document.getElementById('twitterImage').setAttribute('content', "https://archive.org/download/image_2a884fe73/image_2a884fe7~3.jpg");
        }

        function checkRoute() {
            const hash = window.location.hash;
            if (hash.includes('app=')) {
                const match = hash.match(/app=([^&]+)/);
                if (match) {
                    if (allApps.length > 0) {
                        renderDetail(match[1]);
                    } else {
                        setTimeout(() => renderDetail(match[1]), 500);
                    }
                }
            }
        }

        window.onhashchange = checkRoute;
        initStore();
    </script>
